<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2841" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C882" />
      <stop offset="50%" stop-color="#E5A84B" />
      <stop offset="100%" stop-color="#C7832C" />
    </linearGradient>

    <!-- Rust Accent Gradient -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A38" />
      <stop offset="100%" stop-color="#B85419" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Golden Frame Ring -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  
  <!-- Inner Decorative Dashed Track -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Center Artwork Lockup -->
  <g transform="translate(256, 230)">
    <!-- Stylized Feather Pen / Book Pages Motif -->
    <!-- Left Page -->
    <path d="M-80,-20 Q-40,-45 0,-15 L0,75 Q-40,45 -80,70 Z" fill="#F4F1ED" opacity="0.95" />
    <!-- Right Page -->
    <path d="M80,-20 Q40,-45 0,-15 L0,75 Q40,45 80,70 Z" fill="#F4F1ED" opacity="0.85" />
    <!-- Book Spine Glow -->
    <line x1="0" y1="-15" x2="0" y2="75" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Pen Nib in Center -->
    <path d="M0,-85 L22,-35 L12,-20 L0,-30 L-12,-20 L-22,-35 Z" fill="url(#goldGrad)" />
    <!-- Nib Slit & Breather Hole -->
    <line x1="0" y1="-85" x2="0" y2="-45" stroke="#1C2841" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-45" r="4" fill="#1C2841" />

    <!-- Ink Star / Sparkle above Nib -->
    <path d="M0,-115 L4,-100 L19,-96 L4,-92 L0,-77 L-4,-92 L-19,-96 L-4,-100 Z" fill="url(#rustGrad)" />
  </g>

  <!-- Typography: W L Monogram -->
  <text x="256" y="415" 
        text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="64" 
        font-weight="bold"
        letter-spacing="12" 
        fill="url(#goldGrad)">
    WRITER LOKAM
  </text>
  
  <!-- Sub-label -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="system-ui, sans-serif" 
        font-size="20" 
        font-weight="600"
        letter-spacing="8" 
        fill="#F4F1ED" 
        opacity="0.65">
    EST. 2025
  </text>
</svg>
